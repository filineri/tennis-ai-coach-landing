name: Landing V3 quality

on:
  push:
    branches:
      - 'feat/landing-v3-*'
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'icons/**'
      - 'demo/**'
      - 'docs/landing-v3-decision-coverage.md'
      - 'scripts/check_landing.py'
      - 'scripts/build_pages.py'
      - '.github/workflows/landing-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Landing V3
        run: python scripts/check_landing.py
      - name: Build Cloudflare Pages bundle
        run: python scripts/build_pages.py
      - name: Verify deploy bundle
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/demo/live-match/index.html
          test -f dist/demo/tracking/index.html
          test -f dist/demo/player/index.html
